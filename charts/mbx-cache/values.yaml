replicaCount: 2
image:
  repository: ghcr.io/jdx/mbx-cache
  tag: latest
  pullPolicy: IfNotPresent
service:
  port: 8080
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {memory: 512Mi}
config:
  storage: s3
  databaseUrl: ""
  databaseMaxConnections: 32
  azureAccount: ""
  azureContainer: ""
  azurePrefix: v1
  azureCredentialType: auto
  azureEndpoint: ""
  azureAllowHttp: false
  s3Bucket: ""
  s3Prefix: v1
  s3Region: us-east-1
  s3Endpoint: ""
  s3PathStyle: false
  maxBlobBytes: "5368709120"
secret:
  existingSecret: mbx-cache
  tokensKey: tokens-json
  oidcProvidersKey: oidc-providers-json
serviceAccount:
  create: true
  name: ""
podAnnotations: {}
# distroless `nonroot` is uid 65532; the kubelet cannot check a non-numeric
# image USER against runAsNonRoot, so the ids are set explicitly.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
serviceMonitor:
  enabled: false
networkPolicy:
  enabled: true
